[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nids-prototype"
version = "1.0.0"
description = "A small, explainable, rule-based network intrusion detection prototype with a Flask dashboard (portfolio project, not for production use)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
live = ["scapy>=2.5"]

[project.scripts]
nids = "nids.cli:main"

[tool.setuptools]
packages = ["nids", "nids.detectors", "nids.webapp"]

[tool.setuptools.package-data]
"nids.webapp" = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
